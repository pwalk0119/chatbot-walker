[project]
name = "pnw-chatbot-backend"
version = "0.1.0"
description = "Backend for the PNW Policy & Process Q&A Chatbot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
