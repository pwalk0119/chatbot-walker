# Local development services.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the database volume)
services:
  db:
    # PostgreSQL 16 with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg16
    container_name: pnw-chatbot-db
    environment:
      # Local-only credentials; they match DATABASE_URL in backend/.env.example.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pnw_chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pnw_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
